    <style>
        body {
            background-color: #050505;
            color: #e5e5e5;
            /* Subtle CRT scanline effect for analog feel */
            background-image: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
        }
        
        ::selection {
            background-color: #e5e5e5;
            color: #050505;
        }

        /* Customizing Audio Player for Webkit */
        audio::-webkit-media-controls-panel {
            background-color: #111111;
            border: 1px solid #2a2a2a;
            border-radius: 0;
        }
        audio::-webkit-media-controls-current-time-display,
        audio::-webkit-media-controls-time-remaining-display {
            color: #fff;
            font-family: 'Space Mono', monospace;
        }

        .brutalist-border {
            border: 1px solid #2a2a2a;
        }
        
        .nav-link {
            transition: all 0.2s ease;
        }
        .nav-link:hover {
            color: #fff;
            text-shadow: 0 0 8px rgba(255,255,255,0.5);

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-12">

    <script>
        /**

         * fetch('data.json').then(res => res.json()).then(data => initSite(data));
         */
        const siteData = {
            "artistName": "Skarpssinemusic",
            "hero": {
                "logoUrl": "/images/logo_header.png",
                "photoUrl": "/images/foto_header.webp",
                "tagline": "Synth-pop · Alt-dance · Post-punk · Darkwave Revival"

            "biography": "Artista & produtor musical de synth-pop, alt-dance, post-punk. Performance de sintetizador + voz ao vivo com adaptações darkwave de clássicos da música, regado à distorção, sequenciadores e reverb. Flerta com coldwave e darkwave revival.<br><br>Inspirado na ética punk 'faça você mesmo', no synth-pop dos anos 70 como efeito da popularização dos sintetizadores, e experimentos musicais do movimento post-punk.<br><br>Nascido como um projeto de cover de New Order, evoluiu para letras e sons autorais melancólicos e timbres ecoantes. Letras baseadas em literatura própria do autor, convidando os ouvintes a conhecer histórias fantásticas de declínio à loucura, à ascensão à divindade.",
            "inspirations": [

                "The Human League", "The Cure", "Depeche Mode", 
                "Gary Numan", "Joy Division", "Section 25",

            ],
            "music": [
                {

                {

                },

            ],
            "photos": [

                "/images/foto_2.webp",
                "/images/foto_3.webp",
                "/images/foto_4.webp",
                "/images/foto_5.webp",
                "/images/foto_6.webp",
                "/images/foto_7.webp",
                "/images/foto_8.webp"
            ],
            "instagram": {
                "reelId": "DObrxkHEXhS",
                "feedUrls": [
                    "https://www.instagram.com/p/DeJyejFEQ7Q/",
                    "https://www.instagram.com/p/DObrxkHEXhS/",
                    "https://www.instagram.com/p/DNqtmhAv_gD/",
                    "https://www.instagram.com/p/DOSETU-kQe6/",
                    "https://www.instagram.com/p/Cy3bRXEOgk0/",
                    "https://www.instagram.com/p/CyLtzjKu1lT/"
                ]
            },
            "pressRelease": {
                "title": "O Despertar Sintético",
                "content": "Skarpssinemusic funde a crueza do post-punk com o pulso mecânico do darkwave. Um retorno ao analógico e ao DIY, evocando paisagens sonoras sombrias e dançantes. Para pautas, entrevistas e contratações, o press kit completo com fotos em alta resolução e faixas na íntegra está disponível sob demanda."
            },
            "agenda": [
                {"date": "25/07/2025", "venue": "Brocave Pub, Florianópolis", "event": "Open Jam", "theme": "Joy Division + New Order"},
                {"date": "01/08/2026", "venue": "Brocave Pub, Florianópolis", "event": "Wave Sessions", "theme": "Darkwave Classics and Revival"},

                {"date": "01/09/2026", "venue": "Pink Pub, Florianópolis", "event": "Zona 80", "theme": "Vice City Edition"},
                {"date": "24/09/2025", "venue": "Pink Pub, Florianópolis", "event": "Sarau Cultural", "theme": "Especial: New Order Tribute"},
                {"date": "15/11/2025", "venue": "Pink Pub, Florianópolis", "event": "Wave Sessions", "theme": "Darkwave Classics and Revival"},
                {"date": "17/01/2026", "venue": "Pink Pub", "event": "Zona 80", "theme": "80s Darkwave and Clubbing"}

            "contact": {

                "email": { "label": "contato@skarpssine.com", "url": "mailto:contato@skarpssine.com" }
            }
        };

        function initSite(data) {
            // Update Page Titles
            document.title = `${data.artistName} | Media Kit`;
            document.getElementById('nav-brand').textContent = data.artistName;

            // 1. Hero
            document.getElementById('hero-logo').src = data.hero.logoUrl;
            document.getElementById('hero-photo').src = data.hero.photoUrl;
            document.getElementById('hero-tagline').textContent = data.hero.tagline;

            // 2. Bio
            document.getElementById('bio-content').innerHTML = `<p>${data.biography}</p>`;

            // 3. Inspirations
            const inspContainer = document.getElementById('inspirations-grid');
            data.inspirations.forEach(insp => {
                const span = document.createElement('span');
                span.className = "brutalist-border px-3 py-1 text-xs font-mono uppercase tracking-widest text-gray-400 bg-darkaccent hover:bg-white hover:text-black transition-colors cursor-default";
                span.textContent = insp;
                inspContainer.appendChild(span);
            });

            // 4. Music
            const musicContainer = document.getElementById('music-list');
            data.music.forEach(track => {
                const trackDiv = document.createElement('div');
                trackDiv.className = "bg-darkaccent brutalist-border p-4 flex flex-col gap-2";
                trackDiv.innerHTML = `
                    <span class="font-mono text-sm tracking-wide">${track.title}</span>
                    <audio controls class="w-full h-8 outline-none">
                        <source src="${track.audioUrl}" type="audio/mpeg">
                        Seu navegador não suporta o elemento de áudio.
                    </audio>
                `;
                musicContainer.appendChild(trackDiv);
            });

            // 5. Photos
            const photosContainer = document.getElementById('photos-grid');
            data.photos.forEach(url => {
                const imgWrap = document.createElement('div');
                imgWrap.className = "aspect-square overflow-hidden brutalist-border bg-darkaccent group relative";
                imgWrap.innerHTML = `
                    <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity z-10 flex items-center justify-center">
                        <span class="text-white font-mono text-xs uppercase tracking-widest">+ Expand</span>
                    </div>
                    <img src="${url}" alt="Gallery Photo" class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-500 transform group-hover:scale-105">
                `;
                photosContainer.appendChild(imgWrap);
            });

            /*

            // 6. Instagram
            // Load Reel via Iframe
            const reelContainer = document.getElementById('ig-reel-container');
            reelContainer.innerHTML = `<iframe src="https://www.instagram.com/reel/${data.instagram.reelId}/embed" class="w-full h-full min-h-[450px] border-none" frameborder="0" scrolling="no" allowtransparency="true"></iframe>`;
            
            // Load Feed Simulation
            const feedContainer = document.getElementById('ig-feed-grid');
            data.instagram.feedUrls.forEach(url => {
                const div = document.createElement('div');
                div.className = "aspect-square bg-darkaccent brutalist-border overflow-hidden";
                div.innerHTML = `<img src="${url}" class="w-full h-full object-cover opacity-75 hover:opacity-100 transition-opacity">`;
                feedContainer.appendChild(div);
            });

            */

            // 7. Press Release
            document.getElementById('press-title').textContent = data.pressRelease.title;
            document.getElementById('press-content').textContent = data.pressRelease.content;

            // 8. Agenda
            // Sorting agenda dates chronologically (assuming DD/MM/YYYY format)
            
            const parseDate = (dateStr) => {
                const [day, month, year] = dateStr.split('/');
                return new Date(year, month - 1, day);
            };
            
            const sortedAgenda = [...data.agenda].sort((a, b) => parseDate(a.date) - parseDate(b.date));

            const agendaTable = document.getElementById('agenda-table');
            sortedAgenda.forEach(gig => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-white/5 transition-colors group";
                tr.innerHTML = `
                    <td class="p-4 font-mono text-gray-400 whitespace-nowrap align-top w-32 group-hover:text-white transition-colors">${gig.date}</td>
                    <td class="p-4 align-top">
                        <div class="font-bold text-white uppercase tracking-wider">${gig.venue}</div>
                        <div class="text-gray-400 mt-1">${gig.event}</div>
                        <div class="text-xs font-mono text-gray-500 mt-2 p-1 border border-bordergray inline-block bg-darkbg">${gig.theme}</div>
                    </td>
                `;
                agendaTable.appendChild(tr);
            });

            // 9. Contact
            const contactContainer = document.getElementById('contact-links');
            const contactItems = [
                { icon: 'WhatsApp', data: data.contact.whatsapp },
                { icon: 'Instagram', data: data.contact.instagram },
                { icon: 'Email', data: data.contact.email }
            ];

            contactItems.forEach(item => {
                const a = document.createElement('a');
                a.href = item.data.url;
                a.target = "_blank";
                a.className = "brutalist-border p-4 bg-darkaccent hover:bg-white hover:text-black transition-all flex justify-between items-center group";
                a.innerHTML = `
                    <span class="uppercase tracking-widest">${item.icon}</span>
                    <span class="text-gray-400 group-hover:text-black">${item.data.label}</span>
                `;
                contactContainer.appendChild(a);
            });
        }

        // Initialize application on load
        window.addEventListener('DOMContentLoaded', () => {
            initSite(siteData);
        });
    </script>
